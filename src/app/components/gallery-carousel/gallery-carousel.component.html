<div
  id="galleryCarousel"
  class="carousel slide carousel-fade gallery-carousel"
  role="region"
  aria-roledescription="carrusel"
  aria-label="Galería de vehículos"
  tabindex="0"
  (mouseenter)="handleMouseEnter()"
  (mouseleave)="handleMouseLeave()"
  (focusin)="handleFocusIn()"
  (focusout)="handleFocusOut($event)"
  (keydown)="handleKeydown($event)"
>
  <div class="carousel-indicators">
    @for (slide of slides; track slide.title; let index = $index) {
      <button
        type="button"
        [class.active]="activeIndex() === index"
        [attr.aria-current]="activeIndex() === index ? 'true' : null"
        [attr.aria-label]="'Ir a la diapositiva ' + (index + 1)"
        (click)="selectSlide(index)"
      ></button>
    }
  </div>

  <div class="carousel-inner">
    @for (slide of slides; track slide.title; let index = $index; let first = $first) {
      <div class="carousel-item" [class.active]="activeIndex() === index" [attr.aria-hidden]="activeIndex() !== index">
        <img
          [src]="slide.image"
          [alt]="slide.imageAlt"
          [attr.loading]="first ? 'eager' : 'lazy'"
        >
        <div class="slide-overlay">
          <span class="text-gold small fw-bold tracking-widest text-uppercase">{{ slide.label }}</span>
          <h3 class="slide-title mt-1 mb-0">{{ slide.title }}</h3>
          <p class="slide-description text-soft mt-2 mb-0">{{ slide.description }}</p>
        </div>
      </div>
    }
  </div>

  <button
    class="carousel-control-prev carousel-arrow glass-panel"
    type="button"
    aria-label="Ver imagen anterior"
    (click)="previousSlide()"
  >
    <i class="bi bi-chevron-left fs-5" aria-hidden="true"></i>
    <span class="visually-hidden">Anterior</span>
  </button>

  <button
    class="carousel-control-next carousel-arrow glass-panel"
    type="button"
    aria-label="Ver imagen siguiente"
    (click)="nextSlide()"
  >
    <i class="bi bi-chevron-right fs-5" aria-hidden="true"></i>
    <span class="visually-hidden">Siguiente</span>
  </button>
</div>
